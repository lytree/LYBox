name: CI

# 持续集成：
#   - 每次 push 到 main 都执行「全量构建」（宿主 launcher + console + SDK NuGet 打包 + 测试），
#     不再按文件路径跳过（文档改动同样触发，保证主分支每个提交都有构建记录）。
#   - 四平台发布矩阵（win-x64 / win-arm64 / linux-x64 / linux-arm64）在每次 push 到 main
#     以及手动 workflow_dispatch 时都执行，与 release-host.yml 的 RID 矩阵保持一致，
#     用于在合并前发现跨平台编译/发布回归。
#   - PR 只跑基础构建（Ubuntu 编译 + 测试），避免重复消耗跨平台 runner。
#   - 真正的发布（NuGet 推送 / 四平台 zip / GitHub Release）仍由 release-host.yml 负责。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# PR：按 ref 分组并取消过期运行，节省 runner
# 主分支 push：按 commit 分组，互不取消，保证每次 push 都完整跑完多平台构建
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build All Targets (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # --build=all：清理整个 artifacts 目录后，构建宿主（launcher + console）、
      # 构建 SDK 四件套并打包 NuGet，属于脚本层面的「全量」目标。
      - name: Build all (host + console + SDK + pack)
        run: |
          dotnet build/build.cs \
            --build=all \
            --configuration=Release

      - name: Test core
        run: dotnet test tests/LYBox.Tests/LYBox.Tests.csproj -c Release --results-directory artifacts/test-results

      - name: Test Web SDK
        run: node --test tests/WebSdk/*.test.mjs

      - name: Verify artifacts
        run: |
          echo "=== SDK NuGet packages ==="
          ls -lh artifacts/packages/sdk/*.nupkg 2>/dev/null || echo "(none)"
          echo "=== Launcher publish ==="
          # 先排序落盘、再从文件截断。不要写 `find | sort | head`：head 读满行数即关闭管道，
          # sort 收到 EPIPE 会以退出码 2 结束，叠加 GitHub Actions 默认的 `-o pipefail` 会让整步失败。
          find artifacts/publish/launcher -maxdepth 3 -type f 2>/dev/null | sort > /tmp/launcher-publish-files.txt || true
          echo "total: $(wc -l < /tmp/launcher-publish-files.txt) files (showing first 50)"
          head -n 50 /tmp/launcher-publish-files.txt

      - name: Upload SDK NuGet artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-sdk-nuget
          path: artifacts/packages/sdk/*.nupkg
          if-no-files-found: warn
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-results
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 3

  # 跨平台构建矩阵：与 release-host.yml 的 RID 矩阵保持一致，
  # 主分支每次 push 都跑（手动 workflow_dispatch 同样可跑），
  # 只验证各 RID 能否成功发布，不推送 NuGet、不生成 Release。
  build_matrix:
    name: Publish Launcher (${{ matrix.rid }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: ubuntu-latest,  rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish launcher
        shell: bash
        run: |
          dotnet build/build.cs \
            --build=bin \
            --configuration=Release \
            --runtime-identifier=${{ matrix.rid }} \
            --self-contained=true

      - name: Verify publish output
        shell: bash
        run: |
          echo "=== ${{ matrix.rid }} publish output ==="
          # 同 build job：用临时文件承载排序结果，避免 head 提前关管道让 sort 以 EPIPE(2) 退出。
          find "artifacts/publish/launcher/${{ matrix.rid }}" -maxdepth 2 -type f 2>/dev/null | sort > /tmp/publish-files.txt || true
          echo "total: $(wc -l < /tmp/publish-files.txt) files (showing first 40)"
          head -n 40 /tmp/publish-files.txt

      - name: Upload publish output
        uses: actions/upload-artifact@v7
        with:
          name: ci-launcher-${{ matrix.rid }}
          path: artifacts/publish/launcher/${{ matrix.rid }}
          if-no-files-found: warn
          retention-days: 3
