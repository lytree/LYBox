name: Release Main

# 主体（Launcher + SDK NuGet）发布工作流
# 触发标签：V*           例如 V1.2.3、V1.2.3-preview.1、V1.2.3-beta.1
# 产物：
#   - 主体 SDK NuGet 包（LYBox.Plugin.Generators / LYBox.Plugin.CommandLine / LYBox.Plugin.Shared / LYBox.Plugin.Shared.Web）
#   - Launcher 自包含发布包（win-x64 / win-arm64 / linux-x64 / linux-arm64）
# NuGet 发布：使用 Trusted Publishing（OIDC 短期令牌），无需长期 API key。
#   前置条件：
#     1. nuget.org → 账户 → 受信任的发布 → 添加策略（Repository Owner=lytree, Repository=AvaloniaTemplate, Workflow File=release-host.yml, Environment=release）
#     2. GitHub 仓库 → Settings → Environments → 新建 release 环境 → 添加 secret NUGET_USER=<nuget.org 用户名>
#
# 版本解析：
#   - 主体版本唯一真相源：仓库根 `version.props` 的 <LyboxVersion>
#   - resolve_context 读取该文件得到版本号，再由各作业经 --host-version 传入 build.cs
#   - 发版流程：修改 version.props → 提交 → 打标签 V<version> → push 触发本工作流
#   - workflow_dispatch 手动触发时同样以 version.props 为准，tag 固定为 V<version>

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.2.3、1.2.3-preview.1、1.2.3-beta.1；手动触发必填，会发布到 V<version>）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-host-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  MAIN_PROJECT_NAME: 'LYBox.Launcher.Desktop'

jobs:
  resolve_context:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ctx.outputs.version }}
      tag_name: ${{ steps.ctx.outputs.tag_name }}
      is_prerelease: ${{ steps.ctx.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from version.props
        id: ctx
        shell: bash
        run: |
          set -euo pipefail

          # 主体版本唯一真相源：仓库根 version.props 的 <LyboxVersion>
          VERSION="$(grep -oP '(?<=<LyboxVersion>)[^<]+' version.props | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 version.props 解析 <LyboxVersion>"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="V${VERSION}"
          else
            # 标签触发：标签即为 V<version>，需与 version.props 保持一致
            TAG="${GITHUB_REF_NAME}"
          fi

          # 校验版本号格式
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(preview|beta|bate)(\.[0-9]+)?)?$ ]]; then
            echo "::error::版本号格式无效: $VERSION。请使用 x.y.z、x.y.z-preview.N 或 x.y.z-beta.N"
            exit 1
          fi

          # 判断是否为预发布版本
          if [[ "$VERSION" =~ - ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=$TAG version=$VERSION prerelease=$IS_PRERELEASE"

  pack_sdk:
    name: Pack Host SDK NuGet
    needs: resolve_context
    runs-on: ubuntu-latest
    environment: release  # GitHub 环境：承载 NUGET_USER secret 与审批门禁
    permissions:
      id-token: write     # OIDC 令牌颁发（NuGet 可信发布必需）
      contents: read      # 仅读取代码，发布 GitHub Release 由 release 作业负责
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build launcher + pack SDK
        run: |
          dotnet build/build.cs \
            --build=bin \
            --host-version=${{ needs.resolve_context.outputs.version }}

      - name: Upload main SDK NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: main-sdk-nuget
          path: artifacts/packages/sdk/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: NuGet login (OIDC → 短期 API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org 用户名（profile name，非邮箱）

      - name: Push SDK NuGet packages
        run: |
          for pkg in artifacts/packages/sdk/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  publish_host:
    name: Publish Launcher (${{ matrix.rid }})
    needs: resolve_context
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: ubuntu-latest,  rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish launcher
        shell: bash
        run: |
          dotnet build/build.cs \
            --build=bin \
            --runtime-identifier=${{ matrix.rid }} \
            --self-contained=true \
            --host-version=${{ needs.resolve_context.outputs.version }}

      - name: Zip published output
        shell: pwsh
        run: |
          Compress-Archive -Path 'artifacts/publish/launcher/${{ matrix.rid }}/*' -DestinationPath '${{ env.MAIN_PROJECT_NAME }}-${{ matrix.rid }}-${{ needs.resolve_context.outputs.version }}.zip' -Force

      - name: Verify zip
        shell: pwsh
        run: |
          Get-Item "${{ env.MAIN_PROJECT_NAME }}-${{ matrix.rid }}-${{ needs.resolve_context.outputs.version }}.zip" | Format-List Name, Length, LastWriteTime

      - name: Upload main artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MAIN_PROJECT_NAME }}-${{ matrix.rid }}
          path: ${{ env.MAIN_PROJECT_NAME }}-${{ matrix.rid }}-${{ needs.resolve_context.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [resolve_context, pack_sdk, publish_host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.resolve_context.outputs.tag_name }}"
          git push origin "${{ needs.resolve_context.outputs.tag_name }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve_context.outputs.tag_name }}
          name: ${{ needs.resolve_context.outputs.tag_name }}
          prerelease: ${{ needs.resolve_context.outputs.is_prerelease }}
          generate_release_notes: true
          body: |
            ## LYBox v${{ needs.resolve_context.outputs.version }}

            ### SDK NuGet 包
            - `LYBox.Plugin.Generators` ${{ needs.resolve_context.outputs.version }}
            - `LYBox.Plugin.CommandLine` ${{ needs.resolve_context.outputs.version }}
            - `LYBox.Plugin.Shared` ${{ needs.resolve_context.outputs.version }}
            - `LYBox.Plugin.Shared.Web` ${{ needs.resolve_context.outputs.version }}

            ```bash
            dotnet add package LYBox.Plugin.Generators --version ${{ needs.resolve_context.outputs.version }}
            dotnet add package LYBox.Plugin.Shared --version ${{ needs.resolve_context.outputs.version }}
            # 仅 Web 插件需要（前端 WebView IPC + 嵌入式 SDK 资源）：
            dotnet add package LYBox.Plugin.Shared.Web --version ${{ needs.resolve_context.outputs.version }}
            # 仅实现 CLI 命令的插件需要：
            dotnet add package LYBox.Plugin.CommandLine --version ${{ needs.resolve_context.outputs.version }}
            ```

            ### Launcher 自包含发布包
            解压对应平台的 zip 后直接运行 `LYBox.Launcher.Desktop`（无需安装 .NET 运行时）。
          files: |
            artifacts/main-sdk-nuget/*.nupkg
            artifacts/${{ env.MAIN_PROJECT_NAME }}-win-x64/*.zip
            artifacts/${{ env.MAIN_PROJECT_NAME }}-win-arm64/*.zip
            artifacts/${{ env.MAIN_PROJECT_NAME }}-linux-x64/*.zip
            artifacts/${{ env.MAIN_PROJECT_NAME }}-linux-arm64/*.zip
