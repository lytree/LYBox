<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LYBox 插件 UI</title>

    <!--
      LYBox Web SDK：
        - Vite dev 形态：本 <script> 由 Vite 同源代理转发到宿主 /sdk/lybox-plugin-sdk.js（HTTP 58080）。
                       业务代码通过 ./lybox → ./lybox.dev.ts 拿 IDE 提示与完整 HTTP 桥实现。
        - WebView 生产形态：本 <script> 由宿主静态服务直接命中 /sdk/lybox-plugin-sdk.js。
                           业务代码由 vite alias 替换为 ./lybox.prod.ts，运行时透传 window.LyboxPlugin。
      SDK 资源来自 LYBox.Plugin.Shared.Web 嵌入资源（LYBox/version.props 的 <LyboxVersion>）。
    -->
    <script type="module" src="/sdk/lybox-plugin-sdk.js"></script>
  </head>
  <body>
    <main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px">
      <h1>LYBox Web 插件 UI 模板</h1>
      <p id="env">检测运行环境…</p>
      <p>
        <button id="greet">调用 RPC：GreetAsync</button>
        <span id="greet-result" style="margin-left: 12px"></span>
      </p>
      <h2>事件（宿主 → 前端）</h2>
      <ul id="events"></ul>
      <script type="module" src="/src/main.ts"></script>
    </main>
  </body>
</html>
